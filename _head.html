<title>Teodoro Leite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Spectral:ital,wght@1,400&display=swap">
<style>
  :root{
    color-scheme: light;
    --ground:#EAF0F2;
    --surface:#FFFFFF;
    --surface-2:#F3F8F9;
    --ink:#0E2029;
    --ink-2:#4C646E;
    --ink-3:#7B929B;
    --hair:#C3D2D7;
    --hair-2:#DEE8EB;
    --accent:#AE0F60;
    --water:#DCEAF1;
    --water-line:#A8C8D8;

    --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
    --f-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
    --f-chart:'Spectral',Georgia,'Times New Roman',serif;

    --col: 68rem;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ground:#06111A;
      --surface:#0C1B25;
      --surface-2:#102430;
      --ink:#DEE9ED;
      --ink-2:#95ACB6;
      --ink-3:#6C848F;
      --hair:#1E3745;
      --hair-2:#152A36;
      --accent:#FF62A8;
      --water:#12303F;
      --water-line:#2E586B;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:#06111A;
    --surface:#0C1B25;
    --surface-2:#102430;
    --ink:#DEE9ED;
    --ink-2:#95ACB6;
    --ink-3:#6C848F;
    --hair:#1E3745;
    --hair-2:#152A36;
    --accent:#FF62A8;
    --water:#12303F;
    --water-line:#2E586B;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:16px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}

  .wrap{width:min(100% - 2.5rem, var(--col));margin-inline:auto;}

  /* ---- top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(8px);
    border-bottom:1px solid var(--hair);
  }
  .topbar .wrap{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    min-height:3.25rem;
  }
  .mark{
    font-family:var(--f-mono);font-size:.75rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);
  }
  .mark b{font-weight:500;}
  .mark span{color:var(--ink-3);}
  .topnav{display:flex;gap:1.1rem;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);}
  .topnav a{padding-block:.35rem;border-bottom:1px solid transparent;white-space:nowrap;}
  .topnav a:hover{color:var(--accent);border-bottom-color:var(--accent);}
  @media (max-width:900px){ .mark span{display:none;} }
  @media (max-width:620px){ .topnav a:nth-child(n+4){display:none;} }

  /* ---- layout rhythm ---- */
  main{display:grid;gap:clamp(3.5rem,7vw,5.75rem);padding-block:clamp(2.5rem,6vw,4.5rem) 0;}
  section{scroll-margin-top:4.5rem;}

  .sec-head{display:grid;gap:.15rem;margin-bottom:1.75rem;}
  .eyebrow{
    font-family:var(--f-chart);font-style:italic;font-size:1rem;
    color:var(--ink-3);margin:0;
  }
  h2{
    font-family:var(--f-display);font-weight:600;
    font-size:clamp(1.45rem,3vw,1.95rem);letter-spacing:-.015em;
    margin:0;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:1rem;
    text-wrap:balance;
  }
  h2::after{content:"";height:1px;background:var(--hair);}

  /* ---- hero ---- */
  .hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(2rem,5vw,3.5rem);align-items:center;}
  @media (max-width:820px){ .hero{grid-template-columns:1fr;} }
  .hero h1{
    font-family:var(--f-display);font-weight:700;
    font-size:clamp(2.35rem,6.2vw,3.85rem);line-height:1.02;letter-spacing:-.03em;
    margin:.35rem 0 1.1rem;text-wrap:balance;
  }
  .hero .role{
    font-family:var(--f-mono);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin:0;
  }
  .lede{font-size:1.075rem;color:var(--ink-2);max-width:34ch;margin:0 0 1.5rem;}
  .lede strong{color:var(--ink);font-weight:500;}
  .fix{
    font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;color:var(--ink-3);
    margin:0 0 1.5rem;padding-top:.9rem;border-top:1px solid var(--hair);
  }
  .actions{display:flex;flex-wrap:wrap;gap:.6rem;}
  .btn{
    font-family:var(--f-mono);font-size:.78rem;letter-spacing:.07em;
    padding:.55rem .95rem;border:1px solid var(--hair);border-radius:2px;
    background:var(--surface);color:var(--ink);
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);color:#fff;}

  figure.plot{margin:0;}
  figure.plot svg{width:100%;height:auto;display:block;}
  figcaption{
    font-family:var(--f-chart);font-style:italic;color:var(--ink-3);
    font-size:.9rem;margin-top:.5rem;text-align:center;
  }

  /* ---- experience ---- */
  .entry{
    display:grid;grid-template-columns:11rem minmax(0,1fr);gap:2rem;
    border-top:1px solid var(--hair);padding-top:1.4rem;margin-top:1.4rem;
  }
  .entry:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  @media (max-width:720px){ .entry{grid-template-columns:1fr;gap:.75rem;} }
  .when{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.07em;color:var(--ink-3);line-height:1.7;}
  .entry h3{font-family:var(--f-display);font-weight:600;font-size:1.2rem;letter-spacing:-.01em;margin:0;}
  .org{color:var(--accent);font-size:.95rem;margin:.1rem 0 1rem;}
  .block{margin-top:1.15rem;}
  .block h4{
    font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 .4rem;font-weight:500;
  }
  ul{margin:0;padding-left:1.05rem;display:grid;gap:.45rem;}
  li{color:var(--ink-2);}
  li::marker{color:var(--water-line);}
  li b{color:var(--ink);font-weight:500;}

  .sentence{
    margin:1rem 0 0;border:1px solid var(--hair);border-left:2px solid var(--accent);
    background:var(--surface);border-radius:2px;
  }
  .sentence pre{
    margin:0;padding:.7rem .85rem;overflow-x:auto;
    font-family:var(--f-mono);font-size:.76rem;line-height:1.7;color:var(--ink);
  }
  .sentence figcaption{
    text-align:left;padding:0 .85rem .65rem;margin:0;font-size:.85rem;
  }

  /* ---- projects ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15.5rem,1fr));gap:1rem;}
  .card{
    background:var(--surface);border:1px solid var(--hair);border-radius:3px;
    padding:1.25rem 1.35rem 1.4rem;display:flex;flex-direction:column;gap:.6rem;
  }
  .card .when{margin-bottom:-.2rem;}
  .card h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0;letter-spacing:-.01em;}
  .card p{margin:0;color:var(--ink-2);font-size:.95rem;}
  .card ul{font-size:.925rem;}

  /* ---- skills ---- */
  .skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1.5rem 2rem;}
  .skills h3{
    font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 .6rem;font-weight:500;
  }
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;list-style:none;padding:0;margin:0;}
  .chips li{
    background:var(--water);border:1px solid var(--water-line);border-radius:2px;
    padding:.22rem .55rem;font-size:.83rem;color:var(--ink);
  }

  /* ---- education ---- */
  .edu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem;}
  @media (max-width:720px){ .edu{grid-template-columns:1fr;} }
  .courses{display:grid;gap:.9rem;}
  .courses div{display:grid;gap:.35rem;}
  .stat{
    font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }

  /* ---- footer ---- */
  footer{
    margin-top:clamp(3.5rem,7vw,5.5rem);border-top:1px solid var(--hair);
    background:var(--surface-2);padding-block:2.5rem 3rem;
  }
  .foot{display:flex;flex-wrap:wrap;gap:1.5rem 2.5rem;align-items:baseline;justify-content:space-between;}
  .foot h2{display:block;}
  .foot h2::after{content:none;}
  .contact{display:flex;flex-wrap:wrap;gap:1.25rem;font-family:var(--f-mono);font-size:.85rem;}
  .contact a{border-bottom:1px solid var(--hair);padding-bottom:.15rem;}
  .contact a:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .colophon{
    margin-top:2rem;font-family:var(--f-chart);font-style:italic;
    color:var(--ink-3);font-size:.9rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
