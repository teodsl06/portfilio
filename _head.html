<title>Teodoro Leite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Spectral:ital,wght@1,400&display=swap">
<style>
  :root{
    color-scheme: light;
    --ground:#EAF0F2;
    --surface:#FFFFFF;
    --surface-2:#F3F8F9;
    --ink:#0E2029;
    --ink-2:#4C646E;
    --ink-3:#7B929B;
    --hair:#C3D2D7;
    --hair-2:#DEE8EB;
    --accent:#AE0F60;
    --water:#DCEAF1;
    --water-line:#A8C8D8;
    --c-ais:#0B7F86;
    --c-echo:#9A5B00;
    --link-a:#2D5BD0;

    --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
    --f-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
    --f-chart:'Spectral',Georgia,'Times New Roman',serif;

    --col: 68rem;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ground:#06111A;
      --surface:#0C1B25;
      --surface-2:#102430;
      --ink:#DEE9ED;
      --ink-2:#95ACB6;
      --ink-3:#6C848F;
      --hair:#1E3745;
      --hair-2:#152A36;
      --accent:#FF62A8;
      --water:#12303F;
      --water-line:#2E586B;
      --c-ais:#5BE3E0;
      --c-echo:#FFC34D;
      --link-a:#7EA2FF;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:#06111A;
    --surface:#0C1B25;
    --surface-2:#102430;
    --ink:#DEE9ED;
    --ink-2:#95ACB6;
    --ink-3:#6C848F;
    --hair:#1E3745;
    --hair-2:#152A36;
    --accent:#FF62A8;
    --water:#12303F;
    --water-line:#2E586B;
    --c-ais:#5BE3E0;
    --c-echo:#FFC34D;
    --link-a:#7EA2FF;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:16px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}

  .wrap{width:min(100% - 2.5rem, var(--col));margin-inline:auto;}

  /* ---- top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(8px);
    border-bottom:1px solid var(--hair);
  }
  .topbar .wrap{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    min-height:3.25rem;
  }
  .mark{
    font-family:var(--f-mono);font-size:.75rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);
  }
  .mark b{font-weight:500;}
  .mark span{color:var(--ink-3);}
  .topnav{display:flex;gap:1.1rem;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);}
  .topnav a{padding-block:.35rem;border-bottom:1px solid transparent;white-space:nowrap;}
  .topnav a:hover{color:var(--accent);border-bottom-color:var(--accent);}
  @media (max-width:900px){ .mark span{display:none;} }
  @media (max-width:620px){ .topnav a:nth-child(n+4){display:none;} }

  /* ---- layout rhythm ---- */
  main{display:grid;gap:clamp(3.5rem,7vw,5.75rem);padding-block:clamp(2.5rem,6vw,4.5rem) 0;}
  section{scroll-margin-top:4.5rem;}

  .sec-head{display:grid;gap:.15rem;margin-bottom:1.75rem;}
  .eyebrow{
    font-family:var(--f-chart);font-style:italic;font-size:1rem;
    color:var(--ink-3);margin:0;
  }
  h2{
    font-family:var(--f-display);font-weight:600;
    font-size:clamp(1.45rem,3vw,1.95rem);letter-spacing:-.015em;
    margin:0;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:1rem;
    text-wrap:balance;
  }
  h2::after{content:"";height:1px;background:var(--hair);}

  /* ---- hero ---- */
  .hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(2rem,5vw,3.5rem);align-items:center;}
  @media (max-width:820px){ .hero{grid-template-columns:minmax(0,1fr);} }
  .hero h1{
    font-family:var(--f-display);font-weight:700;
    font-size:clamp(2.35rem,6.2vw,3.85rem);line-height:1.02;letter-spacing:-.03em;
    margin:.35rem 0 1.1rem;text-wrap:balance;
  }
  .hero .role{
    font-family:var(--f-mono);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin:0;
  }
  .lede{font-size:1.075rem;color:var(--ink-2);max-width:34ch;margin:0 0 1.5rem;}
  .lede strong{color:var(--ink);font-weight:500;}
  .fix{
    font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;color:var(--ink-3);
    margin:0 0 1.5rem;padding-top:.9rem;border-top:1px solid var(--hair);
  }
  .actions{display:flex;flex-wrap:wrap;gap:.6rem;}
  .btn{
    font-family:var(--f-mono);font-size:.78rem;letter-spacing:.07em;
    padding:.55rem .95rem;border:1px solid var(--hair);border-radius:2px;
    background:var(--surface);color:var(--ink);
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);color:#fff;}
  button.btn{cursor:pointer;font:inherit;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.07em;}
  .copy-email.copied{background:var(--ink);border-color:var(--ink);color:var(--ground);}
  .copy-email.revealed{background:var(--surface);border-color:var(--accent);color:var(--ink);user-select:all;}
  .plain-email{
    font-family:var(--f-mono);font-size:.78rem;letter-spacing:.05em;color:var(--ink-3);
    margin:.9rem 0 0;
  }
  .plain-email span{color:var(--ink-2);user-select:all;}

  figure.plot{margin:0;}
  figure.plot svg{width:100%;height:auto;display:block;}
  figcaption{
    font-family:var(--f-chart);font-style:italic;color:var(--ink-3);
    font-size:.9rem;margin-top:.5rem;text-align:center;
  }

  /* ---- experience ---- */
  .entry{
    display:grid;grid-template-columns:11rem minmax(0,1fr);gap:2rem;
    border-top:1px solid var(--hair);padding-top:1.4rem;margin-top:1.4rem;
  }
  .entry:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  @media (max-width:720px){ .entry{grid-template-columns:minmax(0,1fr);gap:.75rem;} }
  .when{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.07em;color:var(--ink-3);line-height:1.7;}
  .entry h3{font-family:var(--f-display);font-weight:600;font-size:1.2rem;letter-spacing:-.01em;margin:0;}
  .org{color:var(--accent);font-size:.95rem;margin:.1rem 0 1rem;}
  .block{margin-top:1.15rem;}
  .block h4{
    font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 .4rem;font-weight:500;
  }
  ul{margin:0;padding-left:1.05rem;display:grid;gap:.45rem;}
  li{color:var(--ink-2);}
  li::marker{color:var(--water-line);}
  li b{color:var(--ink);font-weight:500;}

  .sentence{
    margin:1rem 0 0;border:1px solid var(--hair);border-left:2px solid var(--accent);
    background:var(--surface);border-radius:2px;
  }
  .sentence pre{
    margin:0;padding:.7rem .85rem;overflow-x:auto;
    font-family:var(--f-mono);font-size:.76rem;line-height:1.7;color:var(--ink);
  }
  .sentence figcaption{
    text-align:left;padding:0 .85rem .65rem;margin:0;font-size:.85rem;
  }

  /* ---- photography ---- */
  .shot{margin:0 0 .35rem;}
  .shot img{
    width:100%;height:auto;display:block;border-radius:2px;
    border:1px solid var(--hair);background:var(--surface-2);
  }
  .shot figcaption{text-align:left;font-size:.85rem;margin-top:.4rem;}
  .portrait{
    width:104px;height:104px;flex:none;border-radius:50%;object-fit:cover;
    border:1px solid var(--hair);
  }

  /* ---- projects ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15.5rem,1fr));gap:1rem;}
  .card{
    background:var(--surface);border:1px solid var(--hair);border-radius:3px;
    padding:1.25rem 1.35rem 1.4rem;display:flex;flex-direction:column;gap:.6rem;
  }
  .card .when{margin-bottom:-.2rem;}
  .card h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0;letter-spacing:-.01em;}
  .card p{margin:0;color:var(--ink-2);font-size:.95rem;}
  .card ul{font-size:.925rem;}

  /* ---- skills ---- */
  .skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1.5rem 2rem;}
  .skills h3{
    font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 .6rem;font-weight:500;
  }
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;list-style:none;padding:0;margin:0;}
  .chips li{
    background:var(--water);border:1px solid var(--water-line);border-radius:2px;
    padding:.22rem .55rem;font-size:.83rem;color:var(--ink);
  }

  /* ---- education ---- */
  .edu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem;}
  @media (max-width:720px){ .edu{grid-template-columns:minmax(0,1fr);} }
  .courses{display:grid;gap:.9rem;}
  .courses div{display:grid;gap:.35rem;}
  .stat{
    font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }

  /* ---- footer ---- */
  footer{
    margin-top:clamp(3.5rem,7vw,5.5rem);border-top:1px solid var(--hair);
    background:var(--surface-2);padding-block:2.5rem 3rem;
  }
  .foot{display:flex;flex-wrap:wrap;gap:1.5rem 2.5rem;align-items:center;justify-content:space-between;}
  .foot-id{display:flex;align-items:center;gap:1.25rem;}
  .foot h2{display:block;}
  .foot h2::after{content:none;}
  .contact{display:flex;flex-wrap:wrap;gap:1.25rem;font-family:var(--f-mono);font-size:.85rem;}
  .contact a, .contact button{border-bottom:1px solid var(--hair);padding-bottom:.15rem;}
  .contact a:hover, .contact button:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .contact button{
    background:none;border:none;border-bottom:1px solid var(--hair);
    color:inherit;font:inherit;font-family:var(--f-mono);font-size:.85rem;
    padding:0 0 .15rem;cursor:pointer;
  }
  .contact button.copied{color:var(--accent);border-bottom-color:var(--accent);}
  .colophon{
    margin-top:2rem;font-family:var(--f-chart);font-style:italic;
    color:var(--ink-3);font-size:.9rem;
  }

  /* ---- case study page ---- */
  .case-hero h1{
    font-family:var(--f-display);font-weight:700;
    font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.06;letter-spacing:-.025em;
    margin:.4rem 0 1rem;text-wrap:balance;
  }
  .lede.wide{max-width:60ch;font-size:1.1rem;}
  .facts{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));
    gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:2px;
    margin:2rem 0 0;overflow:hidden;
  }
  .facts > div{background:var(--surface);padding:.85rem 1rem;display:grid;gap:.1rem;}
  .facts dt{
    font-family:var(--f-mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .facts dd{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--ink);}

  .two-col{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(1.5rem,4vw,3rem);align-items:start;}
  @media (max-width:860px){ .two-col{grid-template-columns:minmax(0,1fr);} }
  .prose{display:grid;gap:.9rem;max-width:60ch;}
  .prose p{margin:0;color:var(--ink-2);}
  .prose b{color:var(--ink);font-weight:500;}
  .equation{
    font-family:var(--f-mono);font-size:.9rem;color:var(--ink) !important;
    background:var(--surface);border:1px solid var(--hair);border-left:2px solid var(--accent);
    border-radius:2px;padding:.6rem .8rem;overflow-x:auto;
  }
  .caution{
    border-left:2px solid var(--water-line);padding-left:.9rem;
    font-size:.95rem;color:var(--ink-3) !important;
  }

  figure.diagram{margin:0;}
  figure.diagram svg{
    width:100%;height:auto;display:block;
    background:var(--surface);border:1px solid var(--hair);border-radius:3px;
  }
  figure.diagram figcaption{text-align:left;margin-top:.6rem;max-width:58ch;}

  .table-scroll{display:grid;gap:1.5rem;overflow-x:auto;}
  .table-scroll table{
    border-collapse:collapse;width:100%;min-width:22rem;
    font-size:.9rem;font-variant-numeric:tabular-nums;
  }
  .table-scroll caption{
    text-align:left;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-3);padding-bottom:.5rem;
  }
  .table-scroll th, .table-scroll td{
    text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--hair-2);
    color:var(--ink-2);font-weight:400;
  }
  .table-scroll thead th{
    color:var(--ink-3);font-family:var(--f-mono);font-size:.68rem;
    letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--hair);
  }
  .table-scroll tbody th{color:var(--ink);font-weight:500;}
  .table-scroll td.good{color:var(--ink);}
  .table-scroll td.bad{color:var(--accent);}

  .tip{
    position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:40;
    background:var(--ink);color:var(--ground);border-radius:3px;
    font-family:var(--f-mono);font-size:.72rem;letter-spacing:.03em;
    padding:.3rem .5rem;white-space:nowrap;
  }

  /* ---- radar scope (hero) ---- */
  .hero{
    grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);
    grid-template-areas:"copy scope" "list scope";
    align-items:start;row-gap:1.75rem;
  }
  .hero-copy{grid-area:copy;align-self:end;}
  .contacts{grid-area:list;align-self:start;}
  .scope{grid-area:scope;align-self:center;margin:0;position:relative;}
  @media (max-width:820px){ .hero{grid-template-columns:minmax(0,1fr);grid-template-areas:"copy" "scope" "list";} }

  .scope{
    --scope-ink:#8FB9C6;--scope-dim:#4F7484;--scope-ring:#1C4150;--scope-ais:#5BE3E0;
    --scope-echo:#FFC34D;--scope-sweep:#3BE0B5;--scope-acq:#FF62A8;
  }
  .scope-screen{
    position:relative;aspect-ratio:1/1;width:100%;border-radius:50%;overflow:hidden;
    background:#020b12;isolation:isolate;
    box-shadow:0 0 0 1px var(--hair),0 0 0 10px var(--surface),0 0 0 11px var(--hair),0 24px 50px -26px rgb(6 17 26 / .6);
  }
  .scope-stage{position:absolute;inset:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.65,0,.2,1);}
  .scope-svg{display:block;width:100%;height:100%;}
  .sc-rings circle{fill:none;stroke:var(--scope-ring);stroke-width:1.2;}
  .sc-cross line{stroke:var(--scope-ring);stroke-width:1;stroke-dasharray:2 7;}
  .sc-ticks line{stroke:var(--scope-dim);stroke-width:1;}
  .sc-brg text{fill:var(--scope-dim);font:500 10px var(--f-mono);letter-spacing:.06em;text-anchor:middle;}
  .sc-sector use{fill:none;stroke:var(--scope-ink);stroke-opacity:.22;stroke-width:1;}
  .sc-sector text{fill:var(--scope-ink);fill-opacity:.6;font:500 10px var(--f-mono);letter-spacing:.34em;}
  .sc-rng text{fill:var(--scope-dim);font:500 9.5px var(--f-mono);letter-spacing:.08em;}
  .sc-sweep path{fill:var(--scope-sweep);}
  .sc-sweep line{stroke:var(--scope-sweep);stroke-width:1.6;stroke-opacity:.85;}

  .contact{cursor:pointer;outline:none;--g:.7;}
  .contact.work{--c:var(--scope-ais);}
  .contact.build,.contact.course{--c:var(--scope-echo);}
  .contact .echo{fill:url(#echo-rdr);opacity:calc(var(--g) * .8);}
  .contact.work .echo{fill:url(#echo-ais);}
  .contact .sym{fill:var(--c);fill-opacity:.22;stroke:var(--c);stroke-width:1.6;opacity:calc(.5 + var(--g) * .5);}
  .contact .vec{stroke:var(--c);stroke-width:1.4;opacity:calc(.4 + var(--g) * .6);}
  .contact .lbl{font:500 12.5px var(--f-mono);letter-spacing:.04em;fill:var(--scope-ink);}
  .contact .lid{fill:var(--c);}
  .contact .ring{fill:none;stroke:var(--scope-acq);stroke-width:1.3;stroke-dasharray:3 3;opacity:0;transition:opacity .2s;}
  .contact .hit{fill:transparent;}
  .contact:hover .ring,.contact:focus-visible .ring,.contact.hl .ring{opacity:1;}
  .contact:hover .lbl,.contact:focus-visible .lbl,.contact.hl .lbl{fill:#fff;}
  .ownship .os{fill:none;stroke:#DDEBF0;stroke-width:1.6;}
  .ownship .lbl{font-size:10px;letter-spacing:.2em;fill:var(--scope-dim);}
  .acq{opacity:0;pointer-events:none;}
  .acq path{fill:none;stroke:var(--scope-acq);stroke-width:2.2;}
  .acq.on{opacity:1;}
  .acq.on .acq-b{animation:acq .55s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes acq{from{transform:scale(2.6) rotate(45deg);opacity:0;}to{transform:none;opacity:1;}}
  @media (max-width:560px){ .contact .nm{display:none;} }

  .scope-readout{
    margin:1.1rem auto 0;max-width:34rem;text-align:center;min-height:1.4em;
    font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .scope-readout b{color:var(--accent);font-weight:500;}
  .scope figcaption{margin-top:.2rem;}

  .contacts{border:1px solid var(--hair);border-radius:3px;background:var(--surface);}
  .contacts-h{
    display:flex;justify-content:space-between;gap:1rem;margin:0;padding:.55rem .9rem;border-bottom:1px solid var(--hair);
    font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  }
  .contacts ol{list-style:none;margin:0;padding:.3rem 0;display:block;}
  .contacts a{
    display:grid;grid-template-columns:2.4rem minmax(0,1fr) 4.4rem 6.6rem;gap:.75rem;align-items:baseline;
    padding:.4rem .9rem;border-left:2px solid transparent;
  }
  .contacts b{font-family:var(--f-mono);font-weight:500;font-size:.76rem;letter-spacing:.06em;color:var(--c-echo);}
  .contacts .work b{color:var(--c-ais);}
  .contacts .tn{color:var(--ink);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .contacts .tk,.contacts .tm{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;color:var(--ink-3);white-space:nowrap;}
  .contacts .tm{text-align:right;}
  .contacts a:hover,.contacts a:focus-visible,.contacts a.hl{background:var(--surface-2);border-left-color:var(--accent);}
  .contacts a:hover .tn,.contacts a.hl .tn{color:var(--accent);}
  @media (max-width:420px){ .contacts a{grid-template-columns:2.4rem minmax(0,1fr) auto;} .contacts .tk{display:none;} }

  /* ---- dossier: the panel a contact opens ---- */
  html.dossier-open{overflow:hidden;}
  .dossier-backdrop{position:fixed;inset:0;z-index:30;background:rgb(4 14 20 / .45);opacity:0;transition:opacity .35s ease;}
  .dossier-backdrop.on{opacity:1;}
  .scope.engaged{z-index:31;}
  .dossier{
    position:fixed;z-index:40;top:0;left:0;bottom:0;width:min(38rem,50vw);
    display:flex;flex-direction:column;background:var(--ground);color:var(--ink);
    border-right:1px solid var(--hair);box-shadow:24px 0 60px -30px rgb(0 0 0 / .5);
    transform:translateX(-104%);transition:transform .42s cubic-bezier(.2,.8,.2,1);
  }
  .dossier.on{transform:none;}
  @media (max-width:820px){
    .dossier{
      top:auto;right:0;width:auto;height:min(92dvh,100%);border-right:0;border-top:1px solid var(--hair);
      border-radius:14px 14px 0 0;overflow:hidden;transform:translateY(104%);box-shadow:0 -20px 60px -30px rgb(0 0 0 / .55);
    }
  }
  .dossier-bar{
    display:flex;align-items:center;gap:.85rem;padding:.6rem .7rem .6rem 1.1rem;background:#04131c;color:#8FB9C6;
